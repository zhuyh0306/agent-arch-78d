[project]
name = "dataagent-api"
version = "0.1.0"
description = "DataAgent HTTP entrypoint: orchestration, routes, and answer assembly."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=2.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests", "."]
pythonpath = ["."]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.ruff.lint]
# B008: FastAPI's Depends() in a default argument is the framework's idiom,
# not a bug. Everything else stays on.
ignore = ["B008"]
