model_list:
  # Day 1 only needs one route: a local Ollama model, so the smoke test needs no
  # cloud key. Day 16 adds the fast/strong split on top of this entry.
  - model_name: fast
    litellm_params:
      model: ollama/qwen2.5:0.5b
      api_base: os.environ/OLLAMA_BASE_URL
      num_ctx: 4096

  # Day 7 prompt contrast: 0.5b cannot follow multi-constraint prompts, so the
  # comparison also runs on a slightly larger local model. Not a production route.
  - model_name: balanced
    litellm_params:
      model: ollama/qwen2.5:1.5b
      api_base: os.environ/OLLAMA_BASE_URL
      num_ctx: 8192

litellm_settings:
  drop_params: true
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
